name: Compilar Pulso iOS (.ipa)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar Pulso.app (Release ARM64 sem assinatura)
        run: |
          xcodebuild \
            -project Pulso.xcodeproj \
            -scheme Pulso \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Empacotar Pulso-iOS.ipa (não assinado)
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Pulso.app Payload/Pulso.app
          zip -r -9 Pulso-iOS.ipa Payload
          ls -lh Pulso-iOS.ipa

      - name: Assinar Pulso-iOS-signed.ipa (se Secrets estiverem configurados)
        id: sign
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          if [ -z "$IOS_P12_BASE64" ] || [ -z "$IOS_PROVISION_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Secrets de assinatura não configurados; pulando assinatura OTA."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/pulso-build.keychain-db"
          KEYCHAIN_PASS="pulso-ci-temp"
          P12_FILE="$RUNNER_TEMP/cert.p12"
          PROV_FILE="$RUNNER_TEMP/profile.mobileprovision"

          printf '%s' "$IOS_P12_BASE64" | tr -d '\r\n' | base64 --decode > "$P12_FILE"
          printf '%s' "$IOS_PROVISION_BASE64" | tr -d '\r\n' | base64 --decode > "$PROV_FILE"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$P12_FILE" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/1\)/{print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "Nenhuma identidade de assinatura encontrada no .p12."
            exit 1
          fi

          # Extrai entitlements do provisioning profile
          security cms -D -i "$PROV_FILE" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"

          rm -rf PayloadSigned
          mkdir -p PayloadSigned
          cp -R build/Build/Products/Release-iphoneos/Pulso.app PayloadSigned/Pulso.app
          cp "$PROV_FILE" PayloadSigned/Pulso.app/embedded.mobileprovision

          # Ajusta application-identifier para perfis wildcard (*) ou explicitos
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :application-identifier" "$RUNNER_TEMP/entitlements.plist" 2>/dev/null || true)
          if [ -n "$APP_ID" ]; then
            TEAM_PREFIX="${APP_ID%%.*}"
            ID_SUFFIX="${APP_ID#*.}"
            if [ "$ID_SUFFIX" = "*" ]; then
              /usr/libexec/PlistBuddy -c "Set :application-identifier ${TEAM_PREFIX}.app.pulso.ios" "$RUNNER_TEMP/entitlements.plist"
            elif [ "$ID_SUFFIX" != "app.pulso.ios" ]; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${ID_SUFFIX}" "PayloadSigned/Pulso.app/Info.plist"
            fi
          fi

          codesign --force --sign "$IDENTITY" --entitlements "$RUNNER_TEMP/entitlements.plist" --timestamp=none PayloadSigned/Pulso.app
          (cd PayloadSigned && zip -r -9 ../Pulso-iOS-signed.ipa Pulso.app)
          ls -lh Pulso-iOS-signed.ipa
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publicar Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pulso-iOS-ipa
          path: |
            Pulso-iOS.ipa
            Pulso-iOS-signed.ipa
          retention-days: 30

      - name: Atualizar Release v0.9.7 com os .ipa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v0.9.7 >/dev/null 2>&1; then
            gh release create v0.9.7 --title "Pulso iOS 0.9.7" --notes "Build automático do Pulso iOS 0.9.7."
          fi
          gh release upload v0.9.7 Pulso-iOS.ipa --clobber
          if [ -f Pulso-iOS-signed.ipa ]; then
            gh release upload v0.9.7 Pulso-iOS-signed.ipa --clobber
          fi
