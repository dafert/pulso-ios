plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.pulso.android'
    compileSdk 35

    defaultConfig {
        applicationId 'app.pulso.android'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            def ksPass = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def kAlias = System.getenv('ANDROID_KEY_ALIAS')
            def kPass = System.getenv('ANDROID_KEY_PASSWORD')
            if (ksPath != null && !ksPath.trim().isEmpty() && file(ksPath).exists() && ksPass && kAlias && kPass) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.trim().isEmpty() && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
